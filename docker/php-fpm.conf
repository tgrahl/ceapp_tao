[global]
error_log = /proc/self/fd/2
; default 1024 would cut TAO's error lines (they include a trace)
log_limit = 16384

[www]
listen = 127.0.0.1:9000
pm = dynamic
pm.max_children = 16
pm.start_servers = 2
pm.min_spare_servers = 1
pm.max_spare_servers = 4
clear_env = no
catch_workers_output = yes
decorate_workers_output = no
