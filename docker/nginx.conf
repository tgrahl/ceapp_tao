server {
    listen 8080 default_server;
    server_name _;
    root /var/www/html;
    index index.php;

    client_max_body_size 100m;
    sendfile off;

    # Container Apps health probe (does not touch PHP or the database).
    location = /healthz { access_log off; return 200 "ok\n"; }

    # TAO is installed by the tao-install job; never expose the web installer.
    location ^~ /tao/install { return 404; }

    # Never serve runtime data or generated config directly.
    location ^~ /data/   { return 404; }
    location ^~ /config/ { return 404; }
    location ^~ /vendor/ { return 404; }
    location ~ /\.       { return 404; }

    location ~ ^/([^/]*)/(views|locales)/. {}

    location /tao/getFileFlysystem.php {
        rewrite ^(.*)$ /tao/getFileFlysystem.php last;
    }

    location / {
        rewrite ^(.*)$ /index.php;
    }

    location = /favicon.ico { access_log off; log_not_found off; }
    location = /robots.txt  { access_log off; log_not_found off; }

    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass 127.0.0.1:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        # TLS is terminated by the Container Apps ingress.
        fastcgi_param HTTPS $fwd_https;
        fastcgi_buffer_size 16k;
        fastcgi_buffers 4 16k;
        fastcgi_read_timeout 300;
    }
}

map $http_x_forwarded_proto $fwd_https {
    default "";
    https   on;
}
