; Errors: never print them into responses (that breaks TAO's JSON and headers), log them instead
; (php-fpm passes them to the container output). Skip deprecation notices: TAO still has code PHP 8.1+
; flags as deprecated, e.g. jsonSerialize() without a return type.
display_errors = Off
display_startup_errors = Off
log_errors = On
error_reporting = E_ALL & ~E_DEPRECATED & ~E_USER_DEPRECATED

memory_limit = 512M
upload_max_filesize = 100M
post_max_size = 100M
max_execution_time = 300
expose_php = Off

; Keep sessions on the shared Azure Files volume so they survive scale-to-zero
; and are shared between replicas.
session.save_path = "/var/www/html/data/_sessions"
session.gc_maxlifetime = 7200

opcache.enable = 1
opcache.enable_cli = 0
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 30000
; Config files under config/ are PHP and live on Azure Files; re-check them occasionally.
opcache.validate_timestamps = 1
opcache.revalidate_freq = 30
